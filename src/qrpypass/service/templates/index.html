<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>qr-pypass</title>

  <!-- CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <!-- Header / Nav -->
  <div class="row" style="justify-content: space-between; align-items: center;">
    <h1>qr-pypass</h1>
    <div class="row">
      <a href="{{ url_for('vault') }}">Vault</a>
      <a href="{{ url_for('gen_page') }}">Generate</a>
      <a href="{{ url_for('logout') }}">Logout</a>
    </div>
  </div>

  <p class="muted">
    Upload a screenshot or photo containing QR codes.
    Authenticator (otpauth) QRs can be imported and will generate live codes.
  </p>

  <!-- Upload Card -->
  <div class="card">
    <form id="uploadForm" class="row">
      <input
        id="file"
        type="file"
        accept="image/*"
        required
      />

      <label>
        max_results
        <input
          id="maxResults"
          type="number"
          min="1"
          max="50"
          value="8"
        />
      </label>

      <label class="row" style="gap:8px;">
        <input id="autoImportOtp" type="checkbox" checked />
        auto-import otpauth
      </label>

      <button type="submit">Scan</button>
    </form>

    <p id="status" class="muted"></p>
  </div>

  <!-- Results -->
  <div id="results"></div>

  <!-- JS -->
  <script src="{{ url_for('static', filename='app.js') }}"></script>

</body>
</html>
